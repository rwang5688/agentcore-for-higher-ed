AWSTemplateFormatVersion: '2010-09-09'
Description: Bedrock Knowledge Base with S3 vectors, hierarchical chunking, and asset copy

Parameters:
  AssetsBucketName:
    Type: String
    Description: Workshop Studio assets bucket
  KnowledgeZipS3Path:
    Type: String
    Description: Full S3 path to knowledge.zip (bucket/prefix/knowledge.zip)
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Foundation model ID for embeddings

Resources:

  # --- S3 bucket for KB documents ---

  KBDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::AccountId}-${AWS::Region}-education-kb-docs
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  KBSupplementalBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::AccountId}-${AWS::Region}-education-kb-supplemental
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # --- IAM role for the Knowledge Base service ---

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub education-kb-role-${AWS::AccountId}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AmazonBedrockKnowledgeBaseTrustPolicy
            Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Policies:
        - PolicyName: BedrockInvokeModel
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: BedrockInvokeModelStatement
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
              - Sid: MarketplaceOperationsFromBedrockFor3pModels
                Effect: Allow
                Action:
                  - aws-marketplace:Subscribe
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Unsubscribe
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:CalledViaLast: bedrock.amazonaws.com
        - PolicyName: S3DataSourceAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: S3ListBucketStatement
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt KBDocumentsBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount:
                      - !Ref AWS::AccountId
              - Sid: S3GetObjectStatement
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub ${KBDocumentsBucket.Arn}/*
                Condition:
                  StringEquals:
                    aws:ResourceAccount:
                      - !Ref AWS::AccountId
              - Sid: S3SupplementalDataWrite
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt KBSupplementalBucket.Arn
                  - !Sub ${KBSupplementalBucket.Arn}/*
                Condition:
                  StringEquals:
                    aws:ResourceAccount:
                      - !Ref AWS::AccountId
        - PolicyName: S3VectorsAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: S3VectorsPermissions
                Effect: Allow
                Action:
                  - s3vectors:GetIndex
                  - s3vectors:QueryVectors
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                Resource: !Sub arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/education-kb-vectors-${AWS::AccountId}/index/education-kb-default-index
                Condition:
                  StringEquals:
                    aws:ResourceAccount:
                      - !Ref AWS::AccountId

  # --- Lambda to extract knowledge.zip into the KB docs bucket ---

  KBCopyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KBCopyPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::${AssetsBucketName}
                  - !Sub arn:aws:s3:::${AssetsBucketName}/*
              - Effect: Allow
                Action: [s3:PutObject, s3:ListBucket]
                Resource:
                  - !GetAtt KBDocumentsBucket.Arn
                  - !Sub ${KBDocumentsBucket.Arn}/*

  KBCopyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub education-kb-copy-${AWS::AccountId}
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt KBCopyRole.Arn
      Timeout: 120
      MemorySize: 512
      Code:
        ZipFile: |
          # MIT No Attribution
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          import json, urllib.request, zipfile, io
          def _r(event, context, status, data={}):
              body = json.dumps({'Status': status, 'Reason': str(data), 'PhysicalResourceId': context.log_stream_name, 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data})
              req = urllib.request.Request(event['ResponseURL'], data=body.encode(), headers={'Content-Type': ''}, method='PUT')
              urllib.request.urlopen(req)
          import boto3

          def lambda_handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      _r(event, context, "SUCCESS", {})
                      return
                  props = event['ResourceProperties']
                  s3_path = props['KnowledgeZipS3Path']
                  dst_bucket = props['DestBucket']
                  parts = s3_path.split('/', 1)
                  src_bucket = parts[0]
                  src_key = parts[1] if len(parts) > 1 else 'knowledge.zip'
                  print(f"Fetching s3://{src_bucket}/{src_key}")
                  s3 = boto3.client('s3')
                  resp = s3.get_object(Bucket=src_bucket, Key=src_key)
                  zip_bytes = io.BytesIO(resp['Body'].read())
                  count = 0
                  with zipfile.ZipFile(zip_bytes) as zf:
                      for name in zf.namelist():
                          if name.endswith('/'):
                              continue
                          s3.put_object(Bucket=dst_bucket, Key=name, Body=zf.read(name), ContentType='text/markdown')
                          count += 1
                  _r(event, context, "SUCCESS", {'FilesExtracted': count})
              except Exception as e:
                  _r(event, context, "FAILED", {'Error': str(e)})

  KBCopy:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt KBCopyFunction.Arn
      KnowledgeZipS3Path: !Ref KnowledgeZipS3Path
      DestBucket: !Ref KBDocumentsBucket

