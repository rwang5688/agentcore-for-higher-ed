          - name: InstallWorkshopDependencies
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - set -euo pipefail
                - !Sub |
                  sudo -u ${CodeEditorUser} PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install --user pipx
                  sudo -u ${CodeEditorUser} bash -c 'export PATH="$HOME/.local/bin:$PATH" && pipx install bedrock-agentcore-starter-toolkit'
          - name: ConfigureKiroWorkspace
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - '#!/bin/bash'
                - !Sub |
                  # Create Kiro MCP config for the workshop
                  mkdir -p ${HomeFolder}/.kiro
                  tee ${HomeFolder}/.kiro/mcp.json <<EOF
                  {
                    "mcpServers": {
                      "aws-docs": {
                        "command": "uvx",
                        "args": ["awslabs.aws-documentation-mcp-server@latest"],
                        "env": { "FASTMCP_LOG_LEVEL": "ERROR" },
                        "disabled": false,
                        "autoApprove": []
                      },
                      "aws-diagrams": {
                        "command": "uvx",
                        "args": ["awslabs.aws-diagram-mcp-server@latest"],
                        "env": { "FASTMCP_LOG_LEVEL": "ERROR" },
                        "disabled": false,
                        "autoApprove": []
                      },
                      "strands-agents": {
                        "command": "uvx",
                        "args": ["strands-agents-mcp-server"],
                        "env": { "FASTMCP_LOG_LEVEL": "INFO" },
                        "disabled": false,
                        "autoApprove": ["search_docs", "fetch_doc"]
                      }
                    }
                  }
                  EOF
                  # Create steering file for the workshop
                  mkdir -p ${HomeFolder}/.kiro/steering
                  tee ${HomeFolder}/.kiro/steering/workshop.md <<EOF
                  # Education Agents Workshop Context

                  ## Project
                  You are helping build AI agents for education using Strands Agents and Amazon Bedrock AgentCore. The primary agent is an Admission Agent that guides prospective students through course discovery and application.

                  ## Data
                  - Education data tables in Athena (education_workshop_db): course, course_outcome, course_registration, course_schedule, degree_plan, department, ed_level, faculty, school, semester, student, university
                  - Knowledge Base: University course handbook PDFs (programs, prerequisites, enrolment policies)
                  - Full dataset available via AgentCore Gateway (Athena SQL, database: education_workshop_db)

                  ## Patterns
                  - Use @tool decorator for custom tools with descriptive docstrings
                  - Use python-dotenv to load .env configuration
                  - Use BotocoreConfig with retries, connect_timeout, read_timeout
                  - Use MCPClient for enrollment system integration (read/write records)
                  - Use BedrockAgentCoreApp with @app.entrypoint for deployment
                  - Agent tools live in strands_agents/ directory

                  ## Configuration
                  - .env file is generated by scripts/load_config.sh from Workshop Studio CloudFormation exports
                  - KNOWLEDGE_BASE_ID and AGENTCORE_MCP_URL are set manually as you progress
                  EOF

                  # Write database schema reference for Module 6
                  mkdir -p ${HomeFolder}/workshop-assets
                  tee ${HomeFolder}/workshop-assets/database-schema.md <<'SCHEMAEOF'
                  # Education Workshop Database Schema

                  Database: `education_workshop_db`
                  All data is scoped to the **College of Engineering** (school_id = 2) and its five departments.

                  ## Tables

                  ### student
                  Student records including admissions and academic performance.
                  Columns: student_id (PK), first_name, last_name, gender ('M'/'F'), birth_date, email_address, admitted ('1'/'0'), enrolled ('1'/'0'), parent_alum ('1'=alumni), parent_highest_ed (FK?ed_level.ed_level_id), first_gen_hed_student ('1'=first gen), high_school_gpa, was_hs_athlete_ind, home_state_name, admit_type ('Regular'/'Early Action'/'Early Decision'), private_hs_indicator, multiple_majors_indicator, secondary_class_percentile, department_id (FK?department), admit_semester_id (FK?semester), first_year_gpa, cumulative_gpa, enroll_status ('enrolled'/'admitted'/'declined'), planned_grad_semester_id (FK?semester, 0 if not enrolled)

                  ### course
                  Course catalogue.
                  Columns: course_id (PK), course_name, course_level ('100','200','300'), course_code (e.g. 'COMP-0100','AERO-0200'), school_id (FK?school), department_id (FK?department)

                  ### course_registration
                  Which students registered for which courses.
                  Columns: date_registered, date_dropped ('0001-01-01' if not dropped), student_id (FK?student), course_id (FK?course), status ('completed'), semester_id (FK?semester), update_ts

                  ### course_outcome
                  Student grades per course.
                  Columns: student_id (FK?student), course_id (FK?course), semester_id (FK?semester), score (numeric), letter_grade ('A+','A','A-','B+','B','B-','C','C+','D','F')

                  ### course_schedule
                  When and where courses are offered.
                  Columns: course_id (FK?course), semester_id (FK?semester), staff_id (FK?faculty), lecture_days, lecture_start_hour, lecture_duration, lab_days, lab_start_hour, lab_duration

                  ### degree_plan
                  Planned course sequences per student.
                  Columns: student_id (FK?student), course_id (FK?course), course_seq_no, status ('completed'/'pending'), is_major_ind ('1'=major req/'0'=elective), semester_seq_no

                  ### department
                  Columns: department_id (PK), department_name ('Aeronautics','Computer Science','Data Science','Engineering','Environment and Natural Resources'), department_code ('AERO','COMP','DATA','ENGI','ENVI'), school_id (FK?school, always 2)

                  ### school
                  Columns: school_id (PK, only 2), school_name ('College of Engineering'), relative_website_url, university_id (FK?university)

                  ### faculty
                  Columns: faculty_id (PK), first_name, last_name, gender, department_id (FK?department), tenure_years, is_tenured, title ('professor'/'associate professor'/'assistant instructor'/'instructor'), dept_chair

                  ### semester
                  Columns: semester_id (PK, 29?43), start_date, end_date, term_name ('Fall'/'Spring'), semester_year, school_year_name (e.g. '2014-2015'). Spans Fall 2014 to Fall 2021.

                  ### ed_level
                  Parent education level lookup.
                  Columns: ed_level_id (PK, 0?9), ed_level_code (e.g. 'HS Grad','Bachelors'), ed_level_desc

                  ### university
                  Columns: university_id (PK), university_name, website_url

                  ## Key Relationships
                  - student.department_id ? department.department_id
                  - student.admit_semester_id / planned_grad_semester_id ? semester.semester_id
                  - student.parent_highest_ed ? ed_level.ed_level_id
                  - course.department_id ? department.department_id
                  - course_registration.student_id ? student.student_id
                  - course_registration.course_id ? course.course_id
                  - course_registration.semester_id ? semester.semester_id
                  - course_outcome: same FKs as course_registration
                  - course_schedule.course_id ? course, .semester_id ? semester, .staff_id ? faculty
                  - degree_plan.student_id ? student, .course_id ? course
                  - faculty.department_id ? department.department_id

                  ## Important Notes
                  - All column types are STRING in Athena. Cast for aggregations: CAST(cumulative_gpa AS DOUBLE), CAST(score AS INTEGER).
                  - Course codes follow pattern DEPT-NNNNN (e.g. COMP-0100, AERO-0200).
                  - course_registration.status only contains 'completed' in this dataset.
                  - degree_plan.status is 'completed' or 'pending'.
                  - student.enroll_status is 'enrolled', 'admitted', or 'declined'.
                  SCHEMAEOF

                  chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}/.kiro
                  chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}/workshop-assets

                  # Pre-built MCP server for Module 9 (Advisor Requests)
                  mkdir -p ${HomeFolder}/mcp
                  tee ${HomeFolder}/mcp/advisor_requests_server.py <<'MCPEOF'
                  import json
                  import os

                  import boto3
                  from mcp.server.fastmcp import FastMCP

                  mcp = FastMCP("advisor-requests")

                  LAMBDA_NAME = os.environ.get("ADVISOR_REQUESTS_LAMBDA", "education-advisor-requests")
                  client = boto3.client("lambda", region_name=os.environ.get("AWS_REGION", "us-east-1"))


                  def _invoke_lambda(payload: dict) -> dict:
                      response = client.invoke(
                          FunctionName=LAMBDA_NAME,
                          InvocationType="RequestResponse",
                          Payload=json.dumps(payload),
                      )
                      result = json.loads(response["Payload"].read())
                      body = json.loads(result["body"]) if isinstance(result.get("body"), str) else result
                      return body.get("result", body)


                  @mcp.tool()
                  def submit_advisor_request(student_id: str, request_type: str, description: str) -> str:
                      """Submit an advisor request on behalf of a student.

                      Args:
                          student_id: The student's ID (e.g. '100016')
                          request_type: Type of request ? one of: course_override, advisor_meeting, program_change, special_consideration
                          description: Detailed description of what the student is requesting
                      """
                      result = _invoke_lambda({
                          "action": "submit_request",
                          "student_id": student_id,
                          "request_type": request_type,
                          "description": description,
                      })
                      return json.dumps(result, indent=2, default=str)


                  @mcp.tool()
                  def list_advisor_requests(student_id: str) -> str:
                      """List all advisor requests for a student.

                      Args:
                          student_id: The student's ID (e.g. '100016')
                      """
                      result = _invoke_lambda({
                          "action": "list_requests",
                          "student_id": student_id,
                      })
                      return json.dumps(result, indent=2, default=str)


                  if __name__ == "__main__":
                      mcp.run(transport="stdio")
                  MCPEOF

                  tee ${HomeFolder}/mcp/requirements.txt <<'REQEOF'
                  mcp>=1.19.0
                  boto3
                  REQEOF

                  tee ${HomeFolder}/mcp/tools.json <<'TOOLSEOF'
                  [
                    {
                      "name": "submit_advisor_request",
                      "description": "Submit an advisor request for a student (course override, advisor meeting, program change, or special consideration)",
                      "inputSchema": {
                        "type": "object",
                        "properties": {
                          "student_id": { "type": "string", "description": "The student ID" },
                          "request_type": { "type": "string", "enum": ["course_override", "advisor_meeting", "program_change", "special_consideration"] },
                          "description": { "type": "string", "description": "Details about the request" }
                        },
                        "required": ["student_id", "request_type", "description"]
                      }
                    },
                    {
                      "name": "list_advisor_requests",
                      "description": "List all advisor requests for a student",
                      "inputSchema": {
                        "type": "object",
                        "properties": {
                          "student_id": { "type": "string", "description": "The student ID" }
                        },
                        "required": ["student_id"]
                      }
                    }
                  ]
                  TOOLSEOF

                  pip3 install -r ${HomeFolder}/mcp/requirements.txt
                  chown -R ${CodeEditorUser}:${CodeEditorUser} ${HomeFolder}/mcp

                  echo "Kiro workspace configured with MCP servers and steering"

